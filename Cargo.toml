[workspace]
members = [
    "crates/core",
    "crates/codex",
    "crates/git",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
recall-core = { path = "crates/core" }
recall-codex = { path = "crates/codex" }
recall-git = { path = "crates/git" }
serde_json = "1"
ureq = { version = "=3.2.1", features = ["json"] }
